[package]
name = "dn-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MCP client, capability wrapper, approval gate and side-effect ledger (ADR-0006)"

[features]
# `dn_tools::injection`: the prompt-injection harness for tool calls, for this crate's tests
# and for add-ons' own tests (a private add-on runs its real reader through it).
test-support = []

[dependencies]
dn-core.workspace = true
dn-agent.workspace = true
dn-secrets.workspace = true
# Only for `held::Approved`, the proof a person answered a held call (ADR-0013 §9.4).
dn-jobs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "process", "net", "io-util"] }
rusqlite.workspace = true
process-wrap.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rmcp = { version = "3.11", default-features = false, features = [
    "client",
    "transport-async-rw",
    "transport-streamable-http-client-reqwest",
    "auth",
    "reqwest",
] }

[dev-dependencies]
dn-tools = { path = ".", features = ["test-support"] }
dn-plugin-api.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "process", "net", "io-util", "io-std", "test-util"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "form", "query"] }
rmcp = { version = "3.11", default-features = false, features = [
    "server",
    "transport-io",
    "transport-streamable-http-server",
] }

[lints]
workspace = true
