[package]
name = "dn-inference"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Inference backends (llama.cpp in-process, OpenAI-compatible servers) behind one trait (ADR-0003)."

[features]
default = ["llamacpp", "openai-compat"]
# In-process llama.cpp via llama-cpp-2. Metal is switched on automatically on macOS.
llamacpp = ["dep:llama-cpp-2"]
cuda = ["llamacpp", "llama-cpp-2/cuda"]
vulkan = ["llamacpp", "llama-cpp-2/vulkan"]
openai-compat = ["dep:reqwest"]

[dependencies]
dn-core.workspace = true
futures-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
reqwest = { workspace = true, optional = true }
llama-cpp-2 = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["net"] }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { workspace = true, optional = true, features = ["metal"] }

[lints]
workspace = true
