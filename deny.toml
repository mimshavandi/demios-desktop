[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "MIT-0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0"]

# webpki-root-certs (Mozilla root CA bundle as data) is CDLA-Permissive-2.0; it comes in via
# reqwest + rustls(-platform-verifier). Scoped to this crate only (approved by lead, 2026-11-24).
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

# Our own crates (workspace members) are under PolyForm Shield 1.0.0 (ADR-0017).
# Scoped to them only, so no dependency under that licence can come in.
[[licenses.exceptions]]
crate = "dn-agent"
allow = ["LicenseRef-PolyForm-Shield-1.0.0"]
[[licenses.exceptions]]
crate = "dn-artifacts"
allow = ["LicenseRef-PolyForm-Shield-1.0.0"]
[[licenses.exceptions]]
crate = "dn-core"
allow = ["LicenseRef-PolyForm-Shield-1.0.0"]
[[licenses.exceptions]]
