id: assistant.default
version: 1
description: General-purpose assistant with notes access and artifacts.
prompt: assistant.default.system
model_slots:
  - slot_id: primary
    capability: chat
  - slot_id: fast
    capability: chat
    user_configurable: true
skills: [text.summarize, notes.find_and_read, clock.now]
tools:
  - "mcp.filesystem.*"
  - artifact.create
  - artifact.update
  - artifact.rewrite
  # Tools of the add-ons built into this copy (ADR-0013). They still ask per their tier.
  - "plugin.*"
policies:
  max_steps: 8
  reasoning: auto
  caller: chat.reply
