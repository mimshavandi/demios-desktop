id: text.summarize
version: 1
description: >-
  Summarise a piece of text in plain language. Use when the user asks for a summary,
  TL;DR or key points of text they pasted or that a tool returned.
kind: prompt
risk: read
prompt: text.summarize@v1
model_slot: fast
input_schema:
  type: object
  additionalProperties: false
  required: [text]
  properties:
    text:
      type: string
      description: The text to summarise.
    max_words:
      type: integer
      minimum: 10
      default: 120
output_schema:
  type: object
  required: [summary]
  properties:
    summary: {type: string}
