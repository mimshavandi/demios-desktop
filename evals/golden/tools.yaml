      Highlights
      - Route guards: decorate a route with @route.guard(check) to run a check before the handler.
      - Built-in rate limiter middleware: quillon.middleware.RateLimit.
      - Templates now autoescape output by default.

      Breaking changes
      1. Python 3.10 or newer is required. Python 3.9 is no longer supported.
      2. Template autoescaping is on by default. Mark deliberate HTML output with the |safe filter.
      3. Session cookies now default to SameSite=Lax (previously None).

      Deprecations
      - config.load_env() is deprecated in favour of Settings.from_env(). It still works throughout 3.x and logs a DeprecationWarning. It will be removed in Quillon 4.0.

      Upgrading: see the migration guide at https://quillon.example.org/docs/migrating-3-2
  - match:
      url: quillon.example.org/blog/releases/3-1
    result: |
      Quillon 3.1.0 released
      2 January 2026

      - Async middleware support.
      - New CLI command `quillon routes` lists every registered route.
      - Minimum Python version: 3.9.
      - No deprecations in this release.

      Update, 10 March 2026: 3.1.4 fixes a memory leak in the development server's auto-reloader.
  - match:
