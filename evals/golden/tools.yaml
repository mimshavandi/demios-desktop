  - match:
      url: example.net/reviews/brightwell-kx-40-review
    result: |
      Brightwell KX-40 review: big basket, a few compromises
      Published 2 September 2026

      We used the KX-40 for six weeks. The basket is listed at 5.5 L, and we measured about 5.3 L of usable space below the fill line. Chips came out evenly crisp at 200 °C in 18 minutes.
      Noise: Brightwell doesn't publish a noise figure. We measured 58 dB at 1 m on the highest setting, louder than most rivals we've tested.
      Cleaning: the basket is dishwasher-safe, but after about 30 dishwasher cycles the coating started to show wear, so we'd hand-wash it.
      Verdict: 7/10.
