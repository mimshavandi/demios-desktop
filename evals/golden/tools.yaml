- name: fetch_page
  description: Fetch a web page by URL and return its readable text.
  input_schema:
    type: object
    properties:
      url:
        type: string
        description: The full URL of the page
    required:
    - url
  effect: read
  results:
  - match:
      url: lindenfeld.example.org/waste/yellow-bin
    result: |
      Town of Lindenfeld - Waste & Recycling - Yellow bin (packaging)
      Last updated: 12 February 2026

      From 1 March 2026 the yellow bin takes ALL plastic packaging, including yoghurt pots, margarine tubs, plastic film and carrier bags, as well as metal cans, aluminium foil and drinks cartons. Rinse lightly; there is no need to wash items. Take lids off pots and put them in the bin separately.

      Not allowed in the yellow bin: paper and cardboard (blue bin), glass (glass banks), nappies, plastic toys, electrical items.

      Collection: every second Tuesday (even calendar weeks). Bins must be at the kerb by 06:30 on collection day. If collection day is a public holiday, collection moves to the following Wednesday.

      Questions: abfall@lindenfeld.example.org
  - match:
      url: lindenfeld-living.example.com/blog/recycling-guide-2024
    result: |
      Lindenfeld Living - Our complete recycling guide
      Posted 9 March 2024 by Tilda

      Bins in Lindenfeld can be confusing, so here's our guide!
      Yellow bin: plastic bottles, cans and drinks cartons. Yoghurt pots and margarine tubs are NOT accepted in the yellow bin in Lindenfeld, they go in the black general waste bin. The yellow bin is collected every Wednesday.
      Glass: the bottle banks are open every day, so pop round whenever suits you.
      Hope this helps! Leave a comment if we missed anything.
  - match:
      url: lindenfeld.example.org/waste/glass
    result: |
      Town of Lindenfeld - Glass banks
      Last updated: 5 January 2026

      Glass banks are at: Marktplatz; Bahnhofstrasse 22 car park; the recycling centre Am Kanal 4.
      Times of use: Monday to Saturday, 07:00 to 20:00 only. Do not use glass banks on Sundays or public holidays (noise rules).
      Sort by colour: white, brown, green. Blue and other colours go in green. Lids go in the yellow bin.
      Not allowed: window glass, mirrors, drinking glasses, light bulbs (take these to the recycling centre).
  - match:
      url: lindenfeld.example.org/waste/bulky
    result: |
      Stadt Lindenfeld - Sperrmüll
      Stand: 20. Januar 2026

      Jeder Haushalt hat zwei kostenlose Sperrmüllabholungen pro Jahr, jeweils bis zu 3 m³. Jede weitere Abholung kostet 35 €.
      Anmeldung: über das Online-Formular auf dieser Seite oder per E-Mail an abfall@lindenfeld.example.org, spätestens 14 Tage vor dem Wunschtermin.
      Abholung: immer donnerstags. Bitte die Gegenstände frühestens am Vorabend ab 18 Uhr und spätestens um 6 Uhr am Abholtag an den Straßenrand stellen.
      Nicht zum Sperrmüll gehören: Elektrogeräte (z. B. Fernseher, Kühlschränke, Waschmaschinen), Bauschutt, Autoreifen, Farben und Lacke. Elektrogeräte bitte kostenlos zum Wertstoffhof Am Kanal 4 bringen.
  - match:
      url: lindenfeld.example.org/waste/recycling-centre
    result: |
      Stadt Lindenfeld - Wertstoffhof Am Kanal 4

      Öffnungszeiten: Mittwoch 14-18 Uhr, Samstag 9-13 Uhr.
      Kostenlos angenommen: Elektro- und Elektronikgeräte (bis 5 Stück pro Anlieferung), Altmetall, Grünschnitt (bis 1 m³), Glas.
      Gebührenpflichtig: Bauschutt (10 € pro 100 Liter), Altreifen (4 € pro Stück).
      Nur für Einwohnerinnen und Einwohner Lindenfelds: bitte Personalausweis oder Meldebescheinigung mitbringen.
      Große Elektrogeräte (Kühlschrank, Waschmaschine, Trockner) holen wir auf Wunsch für 25 € pro Gerät ab. Anmeldung per E-Mail an abfall@lindenfeld.example.org.
