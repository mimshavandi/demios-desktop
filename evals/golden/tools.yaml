      Error codes:
      E1 - Temperature sensor fault. Unplug the appliance and contact Brightwell support.
      E3 - Overheating protection has switched the appliance off. Switch off, unplug and let it cool for at least 30 minutes. Make sure there is at least 10 cm of free space behind the air outlet at the back. If E3 appears again, contact support.
