    result: |
      Migrating to Quillon 3.2

      1. Upgrade to Python 3.10 or newer.
      2. Install the new version: pip install "quillon>=3.2,<4"
      3. Run `quillon check --upgrade 3.2`. It lists templates that output raw HTML and will now be escaped.
      4. Replace config.load_env() with Settings.from_env(). This is optional until 4.0 but removes the warnings.
