<!-- Sign-up card, desktop. Page background #ffffff. -->
<style>
  .card { width: 360px; padding: 13px 21px 30px; font-family: system-ui; }
  h2 { font-size: 22px; color: #111111; margin: 0 0 6px; }
  .lead { font-size: 14px; color: #9a9a9a; }            /* body text */
  input { height: 32px; border: 1px solid #d1d5db; font-size: 14px; }
  .terms input[type=checkbox] { width: 16px; height: 16px; }
  .terms { font-size: 11px; color: #9a9a9a; }
  button { height: 36px; padding: 0 16px; font-size: 16px; font-weight: 400;
           color: #ffffff; background: #4f9cf9; border: 0; }
  .error { color: #e11d48; }                            /* shown only by colour */
</style>
<div class="card">
  <h2>Join Lindenfeld Makers</h2>
  <p class="lead">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
  <input type="email" placeholder="Email">
  <input type="password" placeholder="Password" class="error">
  <label class="terms"><input type="checkbox"> I agree to the terms</label>
  <button>Submit</button>
</div>
