<!-- Pricing section, three plan cards in a row. Section background #ffffff. -->
<style>
  section { padding: 48px 24px; font-family: system-ui; }
  h1 { font-size: 40px; color: #1f2937; }
  .intro { font-size: 17px; color: #4b5563; }
  .cards { display: flex; gap: 13px; }
  .card { padding: 20px; border: 1px solid #cbd5e1; }
  .card.basic { height: 380px; } .card.plus { height: 420px; } .card.studio { height: 395px; margin-top: 27px; }
  .card h3 { font-size: 21px; } .price { font-size: 34px; } .per { font-size: 13px; color: #64748b; }
  .features li { font-size: 15px; line-height: 1.2; } .note { font-size: 11px; }
  .badge { font-size: 12px; font-weight: 700; color: #ffffff; background: #f59e0b; padding: 2px 6px; }
  .cta { font-size: 16px; color: #ffffff; background: #15803d; height: 44px; }
  .cta.secondary { background: #ffffff; color: #15803d; border: 1px solid #15803d; height: 30px; }
</style>
<section>
  <h1>Pick a plan</h1>
  <p class="intro">All plans include the workshop calendar.</p>
  <div class="cards">
    <div class="card basic"><h3>Basic</h3><p class="price">€9</p><p class="per">per month</p>
      <ul class="features"><li>2 workshops</li><li>Newsletter</li></ul>
      <button class="cta secondary">Choose</button></div>
    <div class="card plus"><span class="badge">BEST VALUE</span><h3>Plus</h3><p class="price">€19</p><p class="per">per month</p>
      <ul class="features"><li>6 workshops</li><li>Tool library</li><li>Newsletter</li></ul>
      <button class="cta">Start Plus</button></div>
    <div class="card studio"><h3>Studio</h3><p class="price">€39</p><p class="per">per month</p>
      <ul class="features"><li>Unlimited workshops</li><li>Tool library</li><li>Own bench</li></ul>
      <button class="cta secondary">Choose</button><p class="note">Prices incl. VAT</p></div>
  </div>
</section>
