- id: project-data-010
  category: project
  lang: en
  tags: [data, which-file]
  skill: analyze-data-file
  project:
    files: [studio-data/orders.csv, studio-data/budget-2026.xlsx]
  tools: [data_profile]
  turns:
  - role: user
    content: What's the total?
  expect:
    must:
    - Asks which file (orders.csv or budget-2026.xlsx) and which total is meant, or answers for both and says which is which
    must_not:
