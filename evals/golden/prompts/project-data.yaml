- id: project-data-008
  category: project
  lang: en
  tags: [data, not-in-source, no-arithmetic]
  skill: analyze-data-file
  project:
    files: [studio-data/budget-2026.xlsx]
  tools: [data_profile]
  turns:
  - role: user
    content: Did we spend more or less than planned this year, and by how much?
  expect:
    must:
    - Gives planned 18800 and actual 18646.55 from the sheet
    - Says the difference isn't on the fact sheet instead of subtracting, or says actual was below plan without inventing the exact gap
