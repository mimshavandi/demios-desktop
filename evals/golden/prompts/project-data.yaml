# Data-file cases for analyze-data-file (#366): the answer's numbers must come from the
# computed fact sheet. Known answers are in expect.numbers (checked mechanically at the
# precision the answer writes them); every number in the answer must also trace to a
# fact sheet. The files' answers were computed separately and are pinned in
# crates/dn-data/tests/known_answers.rs.
- id: project-data-001
  category: project
  lang: en
  tags: [data, exact-figure, easy]
  skill: analyze-data-file
  project:
    instructions: You help the owner of the Lindenfeld pottery studio with the studio's books.
    files: [studio-data/orders.csv]
  tools: [data_profile]
  turns:
  - role: user
    content: What was our total order amount in orders.csv?
  expect:
    must:
    - Gives the total as 1537.00 (euros), from the fact sheet
    - Mentions that one order has no amount, so the total leaves it out
    must_not:
    - Adds up the rows itself or gives a different total
    tool_calls:
      required: [data_profile]
    numbers: ["1537.00"]
- id: project-data-002
  category: project
  lang: en
  tags: [data, exact-figure]
  skill: analyze-data-file
  project:
    files: [studio-data/orders.csv]
  tools: [data_profile]
  turns:
  - role: user
    content: Which month had the most orders by amount, and how much was it?
  expect:
    must:
    - Names November 2026 with 874.50
    must_not:
    - Names another month as the highest
    tool_calls:
      required: [data_profile]
    numbers: ["874.50"]
- id: project-data-003
  category: project
  lang: en
  tags: [data, groups]
  skill: analyze-data-file
  project:
    files: [studio-data/orders.csv]
  tools: [data_profile]
  turns:
  - role: user
    content: Who's our best customer by amount spent? Give the top one and their total.
  expect:
    must:
    - Names Hofmann with 922.00
    must_not:
    - Ranks customers by number of orders instead of amount without saying so
    tool_calls:
      required: [data_profile]
    numbers: ["922.00"]
- id: project-data-004
  category: project
  lang: en
  tags: [data, outlier]
  skill: analyze-data-file
  project:
    files: [studio-data/orders.csv]
  tools: [data_profile]
  turns:
  - role: user
    content: What's a typical order worth for us?
  expect:
    must:
    - Gives the median, 52.50, as the typical order
    - Says the mean (96.06) is pulled up by one unusually large order
    must_not:
    - Gives only the mean as typical
    tool_calls:
      required: [data_profile]
    numbers: ["52.50", "96.06"]
- id: project-data-005
  category: project
  lang: en
  tags: [data, quality]
  skill: analyze-data-file
  project:
    files: [studio-data/orders.csv]
  tools: [data_profile]
  turns:
  - role: user
    content: Before I send this to the accountant, is there anything wrong with the data?
  expect:
    must:
    - Says one row is missing its amount
    - Says one row is an exact duplicate of another
    must_not:
    - Calls the large private-workshop order an error rather than an unusual value
    tool_calls:
      required: [data_profile]
- id: project-data-006
  category: project
  lang: en
  tags: [data, change]
  skill: analyze-data-file
  project:
    files: [studio-data/orders.csv]
  tools: [data_profile]
  turns:
  - role: user
    content: How much did monthly order amounts grow from September to November, in percent?
  expect:
    must:
    - Gives 176.3% (from 316.50 to 874.50)
    must_not:
    - Works out the percentage itself or gives another figure
    tool_calls:
      required: [data_profile]
    numbers: ["176.3%"]
- id: project-data-007
  category: project
  lang: en
