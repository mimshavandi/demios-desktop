- id: memory-014
  category: memory
  lang: en
  tags:
  - update
  - long-history
  - math
  sessions:
  - - role: user
      content: Thesis deadline is 15 May 2026. Topic is microplastics in river sediment. Terrified.
    - role: assistant
      content: That's a great topic. 15 May noted. Want to break the remaining work into milestones?
  - - role: user
      content: what's a good way to cite a dataset in APA?
    - role: assistant
      content: Author or organisation, year, title in italics, [Data set], publisher, and the DOI or URL.
  - - role: user
      content: 'Good news: got an extension to 30 June because of the lab flood.'
    - role: assistant
      content: That's a relief. New deadline 30 June.
  - - role: user
      content: can you explain what a Kruskal-Wallis test is in 2 sentences
    - role: assistant
      content: It's a non-parametric test that checks whether three or more independent groups come from
        the same distribution, using ranks instead of raw values. Think of it as the rank-based alternative
        to a one-way ANOVA.
  - - role: user
      content: my supervisor Dr Ilunga is going on fieldwork so she moved my deadline again, now it's
        14 July. final final.
    - role: assistant
      content: Okay, 14 July it is. That gives you a bit more room.
  - - role: user
      content: recipe for a quick lentil dal?
    - role: assistant
      content: Fry onion, garlic and ginger, add cumin and turmeric, then red lentils and water. Simmer
        20 minutes and finish with lemon.
  - - role: user
      content: chapter 3 draft is done!!
    - role: assistant
      content: Brilliant, well done! That's a big milestone.
  turns:
  - role: user
    content: It's 2 June 2026 today. How many weeks until my thesis is due?
  expect:
    must:
    - Uses 14 July 2026 as the deadline
    - Says 6 weeks (42 days)
    must_not:
    - Uses 15 May or 30 June as the current deadline
