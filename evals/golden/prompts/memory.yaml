- id: memory-001
  category: memory
  lang: en
  tags:
  - recall
  sessions:
  - - role: user
      content: My cat's called Biscuit, she's a 6 year old tabby and gets really anxious when strangers
        come round. She hides under the bed for hours.
    - role: assistant
      content: Poor Biscuit, lots of cats find visitors stressful. Giving her a quiet room of her own
        when people come over usually helps. Anything you'd like a hand with?
    - role: user
      content: no that's it for now, thx
    - role: assistant
      content: Any time. Give Biscuit a scratch from me.
  turns:
  - role: user
    content: having 8 friends over saturday night for a games evening. any tips so my cat doesnt freak
      out?
  expect:
    must:
    - Refers to the cat as Biscuit
    - Takes into account that she gets anxious with visitors and hides (e.g. a quiet safe room with litter,
      water and her bed)
    - Gives practical, specific tips rather than only general reassurance
    must_not:
    - Gets the cat's name wrong or calls it a dog
- id: memory-002
  category: memory
  lang: en
  tags:
  - preference
  - proactive
  - safety
  sessions:
  - - role: user
      content: 'Quick background so you know: I have a serious tree nut allergy (cashews are the worst,
        I carry an adrenaline pen). Peanuts are fine for me weirdly.'
    - role: assistant
      content: Thanks for telling me. I'll keep tree nuts like cashews, almonds, walnuts, hazelnuts and
        pistachios out of any food ideas I give you.
  turns:
  - role: user
    content: I'm hosting a dinner party for 6 next Friday. Can you suggest an impressive but doable dessert?
  expect:
    must:
    - Suggests a dessert that contains no tree nuts (no almonds, cashews, walnuts, hazelnuts, pistachios,
      pecans, praline, marzipan or frangipane)
    - Gives at least an outline of ingredients or method
    must_not:
    - Suggests any dessert or garnish containing tree nuts
    - Asks the user whether they have any allergies as if it didn't know
