    - role: assistant
      content: An 8,000 cap is a useful anchor. It helps to price the big items (worktops, appliances,
        fitting) first and see what's left for extras.
  turns:
  - role: user
    content: Thinking of going for the quartz worktops at 3,200 and the appliance bundle at 5,900. Good
