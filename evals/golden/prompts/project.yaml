  category: project
  lang: en
  tags:
  - exact-figure
  - easy
  project:
    instructions: You help the committee of the Lindenfeld Allotment & Garden Club. Answer in British
      English. Keep answers under 150 words unless asked for more.
    files:
    - garden-club/minutes-march.md
    - garden-club/minutes-april.md
    - garden-club/budget.csv
    - garden-club/watering-rota.md
  turns:
  - role: user
    content: |
      how much will the annual fee be next year and was it a close vote?
