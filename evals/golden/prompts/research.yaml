- id: research-013
  category: research
  lang: en
  tags:
  - multi-page
  - reasoning
  - citation
  - code
  tools:
  - web_search
  - fetch_page
  turns:
  - role: user
    content: |
      We're on Quillon 3.1.4, server runs Python 3.9. Can we just bump to 3.2 this sprint, or what has to happen first? Our SPA on a different domain uses the session cookie.
  expect:
    must:
    - Says Python must be upgraded to 3.10+ first because 3.2 drops 3.9
    - Flags that the cross-site SPA needs SESSION_COOKIE_SAMESITE = "None" (and Secure) set explicitly
      because the default is now Lax
    - Mentions checking templates for autoescaping (e.g. quillon check --upgrade 3.2)
    - Cites the release notes and/or migration guide URLs
    must_not:
    - Says they can upgrade as-is
    tool_calls:
      required:
      - web_search
      - fetch_page
