- id: writing-004
  category: writing
  lang: en
  tags:
  - email
  - business
  - medium
  turns:
  - role: user
    content: |
      I'm a freelance illustrator. Client Fennick Books hasn't paid invoice INV-2026-031 for 1,450 euros, due 15 October. I already sent a friendly reminder on 22 October, no reply. Contact is Dana Pryce. Write a second reminder, firmer but still polite, and ask for payment within 7 days.
  expect:
    must:
    - Addressed to Dana Pryce at Fennick Books
    - States invoice INV-2026-031, 1,450 euros, due 15 October, and mentions the earlier reminder of 22
