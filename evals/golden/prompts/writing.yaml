- id: writing-001
  category: writing
  lang: en
  tags:
  - email
  - easy
  turns:
  - role: user
    content: write a polite email to my landlord (Mr Hollis) saying the boiler stopped working on Sunday
      8 November and there's no hot water. ask when someone can come. I'm Petra in flat 3
  expect:
    must:
    - Is addressed to Mr Hollis and signed by Petra, flat 3
    - States the boiler stopped on Sunday 8 November and there is no hot water
    - Asks when someone can come to repair it
    - Is polite and reasonably short
    must_not:
    - Invents threats, legal claims or extra problems
