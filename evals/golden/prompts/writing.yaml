  category: writing
  lang: en
  tags:
  - email
  - medium
  turns:
  - role: user
    content: |
      Help me decline a meeting invite without sounding rude. It's from Colm at the regional office, a "quick sync" on Thursday 3pm about the new rota software. I'm swamped Thursday but could do Friday morning or Monday after 2. Keep it short.
  expect:
    must:
    - Declines Thursday 3pm politely, addressed to Colm
    - Offers Friday morning or Monday after 2pm as alternatives
    - Is short (roughly under 100 words)
