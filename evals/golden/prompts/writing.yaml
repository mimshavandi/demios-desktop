  category: writing
  lang: en
  tags:
  - proofread
  - keep-voice
  - hard
  turns:
  - role: user
    content: |
      I'm British, please only fix actual spelling mistakes, do NOT change it to American spelling and don't touch my style.

      "The colour scheme for the centre's reception was finalised last week, though honestly I'm not convinced. The new sofas are a bit garish and the lighting is definately too harsh. We've organised a meeting to discuss it untill everyone's happy."
