- id: writing-009
  category: writing
  lang: en
  tags:
  - rewrite
  - audience
  - hard
  turns:
  - role: user
    content: |
      Rewrite these release notes for our customers (small shop owners, not techies). Short and friendly.

      v2.4.0
      - Migrated invoice PDF renderer to new engine; fixes glyph fallback for non-Latin scripts
      - Added idempotency keys to payment webhook handler to prevent duplicate order creation
      - CSV export now streams rows, reducing memory usage for >50k rows
      - Deprecated legacy /v1/reports endpoint (removal planned for v3)
  expect:
    must:
    - 'Explains in plain language: invoices now show non-Latin characters/other alphabets correctly'
    - Explains duplicate orders from payments should no longer happen
    - Explains large CSV exports are faster or more reliable
    - Mentions the old reports endpoint/feature will be removed in a future version (v3), in plain words
    must_not:
    - Uses unexplained jargon such as 'idempotency', 'webhook' or 'glyph fallback'
