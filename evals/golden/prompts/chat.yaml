  tags:
  - explain
  - math
  - medium
  turns:
  - role: user
    content: |
      I'm 19 and just opened my first savings account. The bank keeps saying "compound interest". What does that actually mean? Like if I put 1000 in at 5% a year, compounded yearly, what do I have after 2 years?
  expect:
    must:
    - Explains that interest is earned on previously earned interest, not only on the original amount
    - Gives 1102.50 after two years (1000 -> 1050 -> 1102.50)
    - Contrasts with simple interest, which would give 1100
    must_not:
    - Gives a wrong final figure
