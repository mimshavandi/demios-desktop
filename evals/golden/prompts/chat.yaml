      Weather is the state of the atmosphere at a particular place and time: today's temperature, rain, wind and cloud. It changes from hour to hour and day to day. Climate is the long-term pattern of weather in a region, usually averaged over 30 years or more. For example, a single cold day in a hot country is weather; the fact that the country is usually hot in summer is its climate. Scientists study climate by looking at long-term records of temperature, rainfall and other measurements.
