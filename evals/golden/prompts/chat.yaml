- id: chat-001
  category: chat
  lang: en
  tags:
  - explain
  - easy
  turns:
  - role: user
    content: my daughter is 10 and asked me how plants eat. can you explain photosynthesis in a way she'd
      get?
  expect:
    must:
    - Explains that plants use sunlight, water and carbon dioxide (air) to make their own food (sugar)
    - Mentions that plants give off oxygen
    - Uses simple words suitable for a 10-year-old (no unexplained terms like 'chloroplast' or 'glucose')
    must_not:
    - Gives a chemical equation without explaining it in plain words
