- id: chat-017
  category: chat
  lang: en
  tags:
  - code
  - rust
  - debugging
  - hard
  turns:
  - role: user
    content: |
      rust complains "cannot borrow `nums` as mutable because it is also borrowed as immutable". I want to append the double of every even number to the end of the vec.

      fn main() {
          let mut nums = vec![1, 2, 3, 4];
          for n in nums.iter() {
              if n % 2 == 0 {
                  nums.push(n * 2);
              }
          }
          println!("{:?}", nums);
      }
  expect:
    must:
    - Explains that the iterator holds an immutable borrow of nums while push needs a mutable borrow
    - Gives working code, e.g. collect the new values into a separate Vec first and then extend, or iterate
      over indices of the original length
    - The fixed program would print [1, 2, 3, 4, 4, 8]
    must_not:
    - Suggests unsafe code or raw pointers
