- id: chat-015
  category: chat
  lang: en
  tags:
  - code
  - debugging
  - javascript
  - medium
  turns:
  - role: user
    content: |
      This returns "[object Object]2.54" instead of 12.5 and I'm losing my mind

      const items = [{price: 6}, {price: 2.5}, {price: 4}];
      const total = items.reduce((sum, item) => sum + item.price);
      console.log(total);
  expect:
    must:
    - Explains that without an initial value reduce uses the first object as the starting accumulator,
      so the object is converted to a string
    - 'Gives the fix: pass 0 as the initial value, e.g. items.reduce((sum, item) => sum + item.price,
      0)'
    - States the corrected result is 12.5
