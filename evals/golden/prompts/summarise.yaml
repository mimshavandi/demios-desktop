- id: summarise-029
  category: summarise
  lang: en
  tags:
  - pasted
  - recipe
  - extract
  turns:
  - role: user
    content: |
      ugh recipe blogs. just give me the ingredients and steps from this

      There's something about autumn that always sends me back to my grandmother's kitchen in the hills above Brückstadt. She never wrote anything down, of course, and it took me three autumns of trial and error (and one very sad, flat attempt that the dog wouldn't even eat) to get this apple cake right. My kids now ask for it every October, and honestly it's become our family's way of saying the season has started. Before we start, a word on apples: use something tart that holds its shape.

      You'll need 3 medium apples, peeled and sliced, 200 g plain flour, 150 g sugar, 2 eggs, 125 g melted butter, 2 tsp baking powder, a pinch of salt and 1 tsp cinnamon. Oh, and a splash of milk (about 3 tbsp) if the batter feels stiff.

      Heat your oven to 180 °C and line a 23 cm round tin. I like to put the radio on at this point. Whisk the eggs and sugar until pale, then stir in the melted butter. Fold in the flour, baking powder, salt and cinnamon, adding the milk if needed. Pour into the tin and press the apple slices into the top in circles, like Oma did. Bake for 40–45 minutes until a skewer comes out clean. Let it cool for 15 minutes before you take it out of the tin, if you can wait that long, which we never can!
  expect:
    must:
    - 'Lists all ingredients with amounts: 3 apples, 200 g flour, 150 g sugar, 2 eggs, 125 g butter, 2
      tsp baking powder, pinch of salt, 1 tsp cinnamon, about 3 tbsp milk if needed'
    - Gives the steps including 180 °C, a 23 cm round tin, 40–45 minutes and cooling 15 minutes
    must_not:
    - Includes the personal story (grandmother, dog, radio)
    - Changes any amount, temperature or time
