    content: |
      revising for my bio exam, can you sum up these notes in 5 key points

      Photosynthesis – lecture 7
      overall: 6CO2 + 6H2O → C6H12O6 + 6O2 using light energy. happens in chloroplasts.
      2 stages. 1) light-dependent reactions: in thylakoid membranes. chlorophyll absorbs light. water is split (photolysis) → O2 released as by-product. produces ATP and NADPH.
      2) light-independent reactions (Calvin cycle): in the stroma. uses ATP + NADPH from stage 1. CO2 fixed by enzyme rubisco to make sugars (G3P → glucose).
      limiting factors: light intensity, CO2 concentration, temperature (enzymes!). rate limited by whichever is in shortest supply.
      exam tip: O2 comes from WATER not CO2!!
  expect:
    must:
    - Gives exactly five key points
    - Says the light-dependent reactions happen in the thylakoids, split water, release oxygen and make
      ATP and NADPH
    - Says the Calvin cycle happens in the stroma and uses ATP/NADPH to fix CO2 with rubisco
    - Mentions the limiting factors (light, CO2, temperature) and that the oxygen comes from water
    must_not:
    - Says the oxygen released comes from carbon dioxide
