[workspace]
resolver = "3"
members = ["crates/*", "apps/cli", "apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-PolyForm-Shield-1.0.0"
# Never published to crates.io; licence tools treat these as our own code (ADR-0017).
publish = false
repository = "https://github.com/mimshavandi/demios-desktop"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
futures-core = "0.3"
# Pinned to the 2.11 minor: the app uses Tauri's `unstable` multiwebview API (no semver
# promise) for the Windows artifact webview (ADR-0012). Every Tauri upgrade must pass the
# e2e-windows artifact isolation spec (apps/desktop/e2e/specs/artifact-child.e2e.mjs).
tauri = { version = "~2.11", features = [] }
tauri-build = { version = "~2.6", features = [] }
# rustls (aws-lc-rs) + platform verifier; no OpenSSL.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset"] }
zeroize = "1"
tokio = { version = "1", default-features = false }
# Maintained fork of the archived serde_yaml (the approved dependency set allows "serde_yaml or a maintained successor").
serde_yaml_ng = "0.10"
# No remote/file $ref resolution: schemas are bundled.
jsonschema = { version = "0.63", default-features = false }
# Pure-Rust backends only (no libdbus/openssl): Keychain, Credential Manager, Secret Service via zbus.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
rusqlite = { version = "0.43", features = ["bundled"] }
ts-rs = { version = "12", default-features = false, features = ["serde-compat", "no-serde-warnings"] }
dn-core = { path = "crates/dn-core", version = "0.1.0" }
dn-store = { path = "crates/dn-store", version = "0.1.0" }
dn-plugin-api = { path = "crates/dn-plugin-api", version = "0.1.0" }
dn-agent = { path = "crates/dn-agent", version = "0.1.0" }
dn-secrets = { path = "crates/dn-secrets", version = "0.1.0" }
process-wrap = { version = "10", default-features = false, features = ["tokio1", "process-group", "job-object"] }
dn-providers = { path = "crates/dn-providers", version = "0.1.0" }
dn-inference = { path = "crates/dn-inference", version = "0.1.0", default-features = false }
dn-models = { path = "crates/dn-models", version = "0.1.0" }
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["common"] }
minijinja = { version = "3.1", default-features = false, features = ["builtins", "serde", "json", "fuel", "macros"] }
minijinja-contrib = { version = "3.1", default-features = false, features = ["pycompat"] }
sha2 = "0.11"
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
clap = { version = "4", features = ["derive"] }
# Ed25519, X25519, HMAC, SHA-256 and the system RNG for device identity and pairing (ADR-0014).
# Already built into the app for rustls; the same version, no default features.
aws-lc-rs = { version = "1.19", default-features = false, features = ["aws-lc-sys"] }
# Paired transport between devices (ADR-0014 §2): TLS 1.3 with pinned raw public keys
# (RFC 7250). Both are already in the tree through reqwest; same versions, aws-lc-rs provider.
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
