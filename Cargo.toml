[workspace]
resolver = "3"
members = ["crates/*", "apps/cli"]
# apps/desktop (Tauri) joins the workspace in T-SHELL-01.

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/mimshavandi/demios-desktop"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
futures-core = "0.3"
rusqlite = { version = "0.43", features = ["bundled"] }
dn-core = { path = "crates/dn-core", version = "0.1.0" }
dn-store = { path = "crates/dn-store", version = "0.1.0" }
dn-inference = { path = "crates/dn-inference", version = "0.1.0", default-features = false }
dn-models = { path = "crates/dn-models", version = "0.1.0" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
reqwest = { version = "0.13", features = ["json"] }
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["common"] }
sha2 = "0.11"
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
