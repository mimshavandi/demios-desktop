[workspace]
resolver = "3"
members = ["crates/*", "apps/cli", "apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/mimshavandi/demios-desktop"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
futures-core = "0.3"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tokio = { version = "1", default-features = false }
rusqlite = { version = "0.43", features = ["bundled"] }
ts-rs = { version = "12", default-features = false, features = ["serde-compat", "no-serde-warnings"] }
dn-core = { path = "crates/dn-core", version = "0.1.0" }
dn-store = { path = "crates/dn-store", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
