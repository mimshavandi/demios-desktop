# cargo-about (T-STORE-07): licence texts for the app's Rust dependency graph, shown in
# Settings › About › Open-source licences. Keep `accepted` in step with deny.toml.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
# Our own crates (publish = false) are the app itself, not third-party packages (ADR-0017).
private = { ignore = true }

# Same scoped exception as deny.toml (Mozilla root CA bundle as data).
[webpki-root-certs]
accepted = ["CDLA-Permissive-2.0"]
