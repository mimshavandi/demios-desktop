# Microsoft Store (MSIX) test package (T-STORE-04, issue #56). Not a release job: it builds an
# UNSIGNED .msix with the placeholder identity (packaging/msix/identity.json) and runs the
# Windows App Certification Kit on it when the runner has one. The package and the WACK report
# are kept as a workflow artifact for 14 days. Nothing is signed for distribution or submitted.
# Runs on demand, and on pull requests that change the packaging.
name: msix
on:
  workflow_dispatch:
  pull_request:
    paths:
      - packaging/msix/**
      - .github/workflows/msix.yml
permissions:
  contents: read
jobs:
  msix:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_ABOUT_VERSION: 0.9.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            ui/artifact-sandbox/package-lock.json
      - name: Packaging script tests
        run: node --test packaging/msix/build-msix.test.mjs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: msix
      # A release build ships the open-source licences list (T-STORE-07), which needs cargo-about.
      - name: Cache cargo-about
        id: cargo-about-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-about.exe
          key: cargo-about-${{ env.CARGO_ABOUT_VERSION }}-${{ runner.os }}
      - name: Install cargo-about
        if: steps.cargo-about-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-about --version ${{ env.CARGO_ABOUT_VERSION }} --locked --features cli --force
      - run: cargo fetch --locked
      - name: npm deps
        run: |
          npm ci --prefix apps/desktop
          npm ci --ignore-scripts --prefix ui/artifact-sandbox
      # No --features: a Store build has no self-updater (the script refuses one anyway).
      - name: Build the MSIX (release app, unsigned, placeholder identity)
        run: node packaging/msix/build-msix.mjs
      # WACK installs the package, and Windows only installs signed packages. So a copy is signed
      # with a throwaway certificate made here. Its key stays in this runner's certificate store
      # and is never exported or uploaded; the uploaded package is the unsigned one.
      - name: Windows App Certification Kit
        id: wack
        continue-on-error: true
        shell: pwsh
        run: |
          $appcert = 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\appcert.exe'
          if (-not (Test-Path $appcert)) {
            "WACK is not installed on this runner; skipped." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }
          $msix = Get-ChildItem target/msix/*.msix | Select-Object -First 1
          $publisher = ([xml](Get-Content target/msix/layout/AppxManifest.xml)).Package.Identity.Publisher
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature `
            -FriendlyName 'Demios CI MSIX test' -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $public = Join-Path $env:RUNNER_TEMP 'msix-test.cer'
          Export-Certificate -Cert $cert -FilePath $public | Out-Null
          Import-Certificate -FilePath $public -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $signed = Join-Path $env:RUNNER_TEMP 'signed.msix'
          Copy-Item $msix.FullName $signed
          $bin = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\signtool.exe' | Sort-Object FullName | Select-Object -Last 1
          & $bin.FullName sign /fd SHA256 /sha1 $cert.Thumbprint /s My $signed
          if ($LASTEXITCODE) { throw 'signtool failed' }
          New-Item -ItemType Directory -Force -Path target/msix/wack | Out-Null
          $report = (Resolve-Path target/msix/wack).Path + '\wack-report.xml'
          & $appcert reset
          & $appcert test -appxpackagepath $signed -reportoutputpath $report
          if (-not (Test-Path $report)) { throw 'WACK wrote no report' }
          $r = [xml](Get-Content $report)
          $overall = $r.REPORT.OVERALL_RESULT
          "WACK overall result: **$overall**" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $r.SelectNodes('//TEST') | Where-Object { $_.RESULT.'#cdata-section' -and $_.RESULT.'#cdata-section' -ne 'PASS' } |
            ForEach-Object { "- $($_.NAME): $($_.RESULT.'#cdata-section')" } |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Remove-Item $cert.PSPath
          if ($overall -ne 'PASS') { throw "WACK: $overall" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msix-test-package
          path: |
            target/msix/*.msix
            target/msix/layout/AppxManifest.xml
            target/msix/wack/
          retention-days: 14
          if-no-files-found: warn
