name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose --config .gitleaks.toml .
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Tauri (apps/desktop) links WebKitGTK on Linux.
      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The shell without the dev fake model (what release builds ship) and with it.
      - run: cargo test -p demios-desktop --no-default-features
      - run: cargo test -p demios-desktop --features dev-fake-model
  design-tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node ui/design-tokens/scripts/build.mjs --check
      # No raw colours, px font sizes, spacing, radii, shadows or z-index in UI code (T-DES-02):
      # a ratchet against ui/design-tokens/lint-baseline.json.
      - run: node --test ui/design-tokens/scripts/lint-ui.test.mjs
      - run: node ui/design-tokens/scripts/lint-ui.mjs
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The UI imports dn-core's generated TS types; fail if they are stale.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p dn-core --features ts ts_bindings
  # Real-app e2e (T-SHELL-05): tauri-driver + WebdriverIO against a debug build with
  # the dev fake model. macOS has no WKWebView WebDriver; see apps/desktop/e2e/README.md.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAURI_DRIVER_VERSION: 2.0.6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/desktop/e2e/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - name: Linux webview + WebDriver deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev webkitgtk-webdriver xvfb
      - name: Cache tauri-driver
        id: tauri-driver-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-${{ env.TAURI_DRIVER_VERSION }}-${{ runner.os }}
      - name: Install tauri-driver
        if: steps.tauri-driver-cache.outputs.cache-hit != 'true'
        # --force: rust-cache may already have restored ~/.cargo/bin with the binary in it
        # when this cache entry has been evicted ("binary already exists in destination").
        run: cargo install tauri-driver --version ${{ env.TAURI_DRIVER_VERSION }} --locked --force
      - name: Build the UI
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - name: Build the app (debug, dev fake model, embedded UI)
        run: cargo build -p demios-desktop --features dev-fake-model,custom-protocol
      - name: Install e2e deps
        working-directory: apps/desktop/e2e
        run: npm ci
      - name: e2e
        working-directory: apps/desktop/e2e
        run: xvfb-run -a npm test
      # SPIKE (#75): screenshots of the child artifact webview
      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-linux
          path: apps/desktop/e2e/screenshots
          if-no-files-found: ignore

  # Windows (WebView2 + msedgedriver) doesn't create a WebDriver session yet:
  # "DevToolsActivePort file doesn't exist". Non-blocking until T-SHELL-06 fixes it
  # (what was tried and next hypotheses: apps/desktop/e2e/README.md).
  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      TAURI_DRIVER_VERSION: 2.0.6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/desktop/e2e/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - name: Cache tauri-driver
        id: tauri-driver-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: tauri-driver-${{ env.TAURI_DRIVER_VERSION }}-${{ runner.os }}
      - name: Install tauri-driver
        if: steps.tauri-driver-cache.outputs.cache-hit != 'true'
        # --force: rust-cache may already have restored ~/.cargo/bin with the binary in it
        # when this cache entry has been evicted ("binary already exists in destination").
        run: cargo install tauri-driver --version ${{ env.TAURI_DRIVER_VERSION }} --locked --force
      - name: msedgedriver matching WebView2 (verbose log)
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $wv = (Get-ItemProperty -Path $key).pv
          Write-Host "WebView2 runtime $wv"
          $driver = Join-Path $env:EDGEWEBDRIVER 'msedgedriver.exe'
          $have = if (Test-Path $driver) { (& $driver --version) -replace '.*?([0-9.]+).*', '$1' } else { '' }
          Write-Host "preinstalled msedgedriver $have"
          if ($have.Split('.')[0] -ne $wv.Split('.')[0]) {
            $dir = Join-Path $env:RUNNER_TEMP 'msedgedriver'
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            Invoke-WebRequest "https://msedgedriver.microsoft.com/$wv/edgedriver_win64.zip" -OutFile "$dir/d.zip"
            Expand-Archive "$dir/d.zip" -DestinationPath $dir -Force
            $driver = Join-Path $dir 'msedgedriver.exe'
          }
          # tauri-driver passes no flags to the native driver: wrap it to get a verbose log.
          $log = Join-Path $env:RUNNER_TEMP 'msedgedriver.log'
          $wrap = Join-Path $env:RUNNER_TEMP 'msedgedriver-verbose.cmd'
          "@`"$driver`" --verbose --log-path=`"$log`" %*" | Out-File -FilePath $wrap -Encoding ascii
          "MSEDGEDRIVER=$wrap" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MSEDGEDRIVER_LOG=$log" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build the UI
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      # msedgedriver turns on WebView2 remote debugging through the
      # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS env var, but wry always sets
      # AdditionalBrowserArguments through the WebView2 API, and the API value wins: the
      # port never opens and session creation fails with "DevToolsActivePort file doesn't
      # exist" (T-SHELL-06, see apps/desktop/e2e/README.md). So this e2e build gets the
      # switches in its window config, generated from tauri.conf.json at build time
      # (TAURI_CONFIG); the app's real config and release builds are unchanged.
      - name: Build the app (debug, dev fake model, embedded UI, WebView2 DevTools on)
        shell: pwsh
        run: |
          $debug = '--remote-debugging-port=0 --enable-automation'
          $wryDefault = '--disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection'
          # The Windows config's window (it carries the WebRTC policy switch, T-ART-06).
          $conf = Get-Content apps/desktop/tauri.windows.conf.json -Raw | ConvertFrom-Json
          $windows = @($conf.app.windows | ForEach-Object {
            $base = if ($_.additionalBrowserArgs) { $_.additionalBrowserArgs } else { $wryDefault }
            $_ | Add-Member -NotePropertyName additionalBrowserArgs -NotePropertyValue "$base $debug" -Force -PassThru
          })
          $env:TAURI_CONFIG = @{ app = @{ windows = $windows } } | ConvertTo-Json -Depth 10 -Compress
          Write-Host "TAURI_CONFIG=$env:TAURI_CONFIG"
          cargo build -p demios-desktop --features dev-fake-model,custom-protocol
      - name: Install e2e deps
        working-directory: apps/desktop/e2e
        run: npm ci
      - name: e2e
        working-directory: apps/desktop/e2e
        run: npm test
      # SPIKE (#75): screenshots of the child artifact webview
      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-windows
          path: apps/desktop/e2e/screenshots
          if-no-files-found: ignore
      - name: Upload msedgedriver log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msedgedriver-log
          path: ${{ env.MSEDGEDRIVER_LOG }}
          if-no-files-found: warn
  # Open-source licences screen (T-STORE-07): every shipped Rust crate, npm package and
  # bundled C/C++ library has an accepted licence (about.toml mirrors deny.toml) and its text.
  licences:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_ABOUT_VERSION: 0.9.3
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            ui/artifact-sandbox/package-lock.json
      - run: npm ci
      # The artifact sandbox's build ships inside the app (npm_roots in licenses-extra.json).
      - run: npm ci --ignore-scripts
        working-directory: ui/artifact-sandbox
      - run: npm run test:scripts
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo-about
        id: cargo-about-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-about
          key: cargo-about-${{ env.CARGO_ABOUT_VERSION }}-${{ runner.os }}
      - name: Install cargo-about
        if: steps.cargo-about-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-about --version ${{ env.CARGO_ABOUT_VERSION }} --locked --features cli
      # cargo-about runs --offline: fetch crate sources first (no build needed).
      - run: cargo fetch --locked
        working-directory: .
      - run: npm run licenses -- --check
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
