# Unsigned preview installers for macOS (arm64, x64), Windows (NSIS) and Linux
# (AppImage, deb, rpm). Each installer is smoke-tested on its OS. The workflow artifact holds
# all of them plus SHA256SUMS.txt.
#
# Release builds only: no `--features`, so there is no dev fake model (it is debug-only
# anyway), no self-updater (`updater` is off) and no e2e WebView2 flags. A guard step
# checks the binaries for dev-only strings.
#
# Publishing is a separate job. It runs only from `main`, through workflow_dispatch with
# `publish: true`, and creates a GitHub pre-release. A `release-preview-check-*` tag runs
# the same builds and smoke tests but never publishes.
name: release-preview
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub pre-release with the installers (main only)"
        type: boolean
        default: false
  push:
    tags: ["release-preview-check-*"]
permissions:
  contents: read
concurrency:
  group: release-preview-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_ABOUT_VERSION: 0.9.3
  TAURI_DRIVER_VERSION: 2.0.6
  # Windows and Linux run local models on the GPU through Vulkan (T-INF-24). The LunarG SDK
  # builds llama.cpp's Vulkan backend; the loader the installers ship is built from a pinned
  # Khronos release (packaging/vulkan-loader/build.sh). Same pins as vulkan.yml.
  VULKAN_SDK_VERSION: 1.4.363.1
  VULKAN_SDK_SHA256_WINDOWS: c02932bd9a968b22d404536108adaacac908c081cd6b0113f5bfefc523dd0a6a
  VULKAN_SDK_SHA256_LINUX: b7867d8ca658563813af666f34b93db87f1b1c7d9d69d97e924c210c7ba33eb8
  # Shown on the About screen (apps/desktop/src/commands.rs, `app_info`).
  DEMIOS_BUILD_CHANNEL: preview
  # Release builds must ship the licences screen (apps/desktop/scripts/licenses.mjs).
  DEMIOS_REQUIRE_LICENSES: "1"
jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.m.outputs.version }}
      short: ${{ steps.m.outputs.short }}
      prefix: ${{ steps.m.outputs.prefix }}
      tag: ${{ steps.m.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          version="$(node -p "require('./apps/desktop/tauri.conf.json').version")"
          short="${GITHUB_SHA::7}"
          {
            echo "version=$version"
            echo "short=$short"
            echo "prefix=Demios-Desktop-$version-preview"
            echo "tag=v$version-preview.$short"
          } >> "$GITHUB_OUTPUT"

  macos:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      DEMIOS_BUILD_COMMIT: ${{ needs.meta.outputs.short }}
      # Ad-hoc signature (`codesign -s -`): seals the bundle, no identity, not notarized.
      APPLE_SIGNING_IDENTITY: "-"
      NAME: ${{ needs.meta.outputs.prefix }}-macos-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            ui/artifact-sandbox/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-preview
      - &cargo-about-cache
        name: Cache cargo-about
        id: cargo-about-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-about*
          key: cargo-about-${{ env.CARGO_ABOUT_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - &cargo-about-install
        name: Install cargo-about
        if: steps.cargo-about-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-about --version ${{ env.CARGO_ABOUT_VERSION }} --locked --features cli --force
      - run: cargo fetch --locked
      - run: npm ci
        working-directory: apps/desktop
      - name: tauri build (release)
        working-directory: apps/desktop
        run: npx tauri build --ci --bundles app,dmg
      - name: Collect
        id: c
        run: |
          set -euo pipefail
          app="$(ls -d target/release/bundle/macos/*.app | head -n1)"
          mkdir -p out
          cp "$(ls target/release/bundle/dmg/*.dmg | head -n1)" "out/$NAME.dmg"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "bin=$app/Contents/MacOS/demios-desktop" >> "$GITHUB_OUTPUT"
      - &guard
        name: No dev-only code in the binary
        shell: bash
        run: |
          set -euo pipefail
          bin="${{ steps.c.outputs.bin }}"
          # Strings only src/fake.rs (cfg(fake_model)), the Windows e2e config, the
          # updater plugin and the #86 spike contain.
          for s in 'DEMIOS_FAKE_DELAY_MS' 'Made by the dev fake model' 'remote-debugging-port' \
                   'spike_open_child' 'spike_child_report' 'plugin:updater'; do
            if grep -aqF -- "$s" "$bin"; then echo "::error::dev-only string '$s' in $bin"; exit 1; fi
          done
          grep -aqF -- "$DEMIOS_BUILD_COMMIT" "$bin" || { echo "::error::commit $DEMIOS_BUILD_COMMIT not embedded"; exit 1; }
          echo "ok: no dev-only strings, commit $DEMIOS_BUILD_COMMIT embedded"
      - name: Signature (expected ad-hoc; Gatekeeper rejects)
        run: |
          app="${{ steps.c.outputs.app }}"
          codesign -dv "$app" 2>&1 | tee -a smoke.txt
          codesign --verify --deep --strict "$app" && echo "codesign --verify: ok" | tee -a smoke.txt
          spctl -a -vv -t exec "$app" >> smoke.txt 2>&1 && echo "::warning::spctl accepted an unsigned app?" || echo "spctl: rejected (expected)" | tee -a smoke.txt
      - name: Smoke test (mount the dmg, launch, window, reinstall keeps data)
        shell: bash
        run: |
          set -euo pipefail
          data="$HOME/Library/Application Support/io.demios.app"
          rm -rf "$data"
          cat > windows.swift <<'EOF'
          import CoreGraphics
          let pid = Int(CommandLine.arguments[1])!
          let list = CGWindowListCopyWindowInfo([.optionAll], kCGNullWindowID) as! [[String: Any]]
          let mine = list.filter { ($0[kCGWindowOwnerPID as String] as? Int) == pid && ($0[kCGWindowLayer as String] as? Int) == 0 }
          let sizes = mine.compactMap { w -> String? in
            guard let b = w[kCGWindowBounds as String] as? [String: Any], let wd = b["Width"] as? Int, let h = b["Height"] as? Int, wd >= 400 else { return nil }
            return "\(wd)x\(h)"
          }
          print("window(s) " + sizes.joined(separator: ", "))
          exit(sizes.isEmpty ? 1 : 0)
          EOF
          swiftc -O windows.swift -o windows
          install_app() {
            mnt="$(mktemp -d)"
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "out/$NAME.dmg" > /dev/null
            rm -rf "/Applications/Demios Desktop.app"
            cp -R "$mnt/Demios Desktop.app" /Applications/
            hdiutil detach "$mnt" > /dev/null
          }
          launch() {
            "/Applications/Demios Desktop.app/Contents/MacOS/demios-desktop" > "app-$1.log" 2>&1 &
            pid=$!
            ok=""
            for i in $(seq 1 30); do
              sleep 2
              kill -0 "$pid" 2>/dev/null || { echo "::error::app exited (run $1)"; cat "app-$1.log"; exit 1; }
              if ./windows "$pid" > "win-$1.txt"; then ok=1; break; fi
            done
            [ -n "$ok" ] || { echo "::error::no window after 60 s (run $1)"; exit 1; }
            sleep 5
            kill -0 "$pid" 2>/dev/null || { echo "::error::app exited after its window appeared (run $1)"; exit 1; }
            echo "run $1: pid $pid alive, $(cat "win-$1.txt")" | tee -a smoke.txt
            kill "$pid"; wait "$pid" 2>/dev/null || true
          }
          install_app
          launch 1
          test -f "$data/demios.sqlite3" || { echo "::error::no database in $data"; ls -la "$data" || true; exit 1; }
          echo keep > "$data/reinstall-check.txt"
          before="$(shasum -a 256 "$data/demios.sqlite3")"
          install_app
          test -f "$data/reinstall-check.txt" && [ "$(shasum -a 256 "$data/demios.sqlite3")" = "$before" ] \
            || { echo "::error::reinstall changed local data"; exit 1; }
          echo "reinstall: local data kept ($data)" | tee -a smoke.txt
          launch 2
          cp smoke.txt "out/smoke-macos-${{ matrix.arch }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos-${{ matrix.arch }}
          path: out/
          retention-days: 1
          if-no-files-found: error

  windows:
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      DEMIOS_BUILD_COMMIT: ${{ needs.meta.outputs.short }}
      PREFIX: ${{ needs.meta.outputs.prefix }}
      # llama.cpp's nested Vulkan shader-generator build goes past Windows' 260-character path
      # limit under the default target dir (C1083); a short one keeps it under.
      CARGO_TARGET_DIR: C:\t
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            ui/artifact-sandbox/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-preview
          workspaces: ". -> C:\\t"
      - *cargo-about-cache
      - *cargo-about-install
      - run: cargo fetch --locked
      - run: npm ci
        working-directory: apps/desktop
      - name: Vulkan SDK (pinned, checksum verified)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $f = "vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe"
          $p = Join-Path $env:RUNNER_TEMP $f
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/$f" -OutFile $p
          $h = (Get-FileHash $p -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:VULKAN_SDK_SHA256_WINDOWS) { throw "Vulkan SDK sha256 $h does not match" }
          $root = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          & $p --root $root --accept-licenses --default-answer --confirm-command install | Out-Host
          "VULKAN_SDK=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$root\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      # llama.cpp's Vulkan shader generator is a nested CMake project; with the Visual Studio
      # generator, MSBuild runs its install step before its build finishes. Ninja inside the
      # MSVC developer environment builds it in order (and faster).
      - name: MSVC developer environment and Ninja for CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" > nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append }
          }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress | Out-Host }
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append
      - &vulkan-loader
        name: Vulkan loader (pinned Khronos release, shipped next to the app)
        shell: bash
        run: packaging/vulkan-loader/build.sh target/vulkan-loader | tee -a "$GITHUB_STEP_SUMMARY"
      - name: tauri build (release)
        working-directory: apps/desktop
        run: npx tauri build --ci --features vulkan --config tauri.vulkan-windows.conf.json --bundles nsis
      - name: Collect
        id: c
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          t="$(cygpath -u "$CARGO_TARGET_DIR")"
          cp "$(ls "$t"/release/bundle/nsis/*-setup.exe | head -n1)" "out/$PREFIX-windows-x64-setup.exe"
          echo "- Windows installer (Vulkan build): $(du -k "out/$PREFIX-windows-x64-setup.exe" | cut -f1) KiB" >> "$GITHUB_STEP_SUMMARY"
          echo "bin=$t/release/demios-desktop.exe" >> "$GITHUB_OUTPUT"
      - *guard
      # tauri-driver can't attach here: msedgedriver needs WebView2 remote debugging, which
      # only the e2e build's window config turns on (apps/desktop/e2e/README.md, T-SHELL-06),
      # and the shipped build must not have it. UI Automation reads the rendered page
      # instead: the main UI's "New chat" button must be in the WebView2 accessibility tree.
      - name: Smoke test (silent install, UI renders, reinstall keeps data, uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes, System.Windows.Forms, System.Drawing
          $data = Join-Path $env:LOCALAPPDATA 'io.demios.app'
          Remove-Item -Recurse -Force $data -ErrorAction SilentlyContinue
          $log = @()
          function Launch([string]$exe, [string]$tag) {
            $p = Start-Process -FilePath $exe -PassThru
            $deadline = (Get-Date).AddSeconds(90)
            $button = $null
            while ((Get-Date) -lt $deadline -and -not $button) {
              Start-Sleep 2
              if ($p.HasExited) { throw "app exited ($tag), code $($p.ExitCode)" }
              $p.Refresh()
              if ($p.MainWindowHandle -eq 0) { continue }
              $win = [System.Windows.Automation.AutomationElement]::FromHandle($p.MainWindowHandle)
              # The button's accessible name may carry its shortcut ("New chat Ctrl+N").
              $cond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::Button)
              $names = @($win.FindAll([System.Windows.Automation.TreeScope]::Descendants, $cond) | ForEach-Object { $_.Current.Name })
              $button = $names | Where-Object { $_ -match '^New chat' } | Select-Object -First 1
            }
            $shot = "out/smoke-windows-$tag.png"
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($shot)
            if (-not $button) { throw "main UI did not render ($tag): no 'New chat' button after 90 s. Buttons seen: $($names -join ' | ')" }
            Start-Sleep 3
            if ($p.HasExited) { throw "app exited after rendering ($tag)" }
            $script:log += "${tag}: pid $($p.Id) alive, window '$($p.MainWindowTitle)', UI rendered (button '$button', $($names.Count) buttons)"
            Stop-Process -Id $p.Id -Force
            Start-Sleep 2
          }
          function Find-Exe([string]$root) {
            (Get-ChildItem -Path $root -Recurse -Filter demios-desktop.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          $setup = (Resolve-Path "out/$env:PREFIX-windows-x64-setup.exe").Path

          trap { $log + "FAILED: $_" | Set-Content out/smoke-windows.txt; break }
          # NSIS, per-user, silent.
          Start-Process -Wait -FilePath $setup -ArgumentList '/S'
          $exe = Find-Exe (Join-Path $env:LOCALAPPDATA 'Demios Desktop')
          if (-not $exe) { throw 'NSIS install: demios-desktop.exe not found' }
          $log += "nsis: installed to $exe"
          # The Vulkan loader the exe links against sits next to it (Windows loads an exe's
          # DLLs from the app's own folder first), and is the one built from the pinned release.
          $dll = Join-Path (Split-Path $exe) 'vulkan-1.dll'
          if (-not (Test-Path $dll)) { throw "vulkan-1.dll not installed next to $exe" }
          $want = (Select-String -Path target/vulkan-loader/SOURCE.txt -Pattern 'sha256 ([0-9a-f]{64})').Matches[0].Groups[1].Value
          $got = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { throw "installed vulkan-1.dll is $got, built $want" }
          $log += "nsis: vulkan-1.dll next to the exe (sha256 $got); no GPU on this runner, so the app must start in CPU mode"
          Launch $exe 'nsis-1'
          if (-not (Test-Path (Join-Path $data 'demios.sqlite3'))) { throw "no database in $data" }
          Set-Content (Join-Path $data 'reinstall-check.txt') 'keep'
          $before = (Get-FileHash (Join-Path $data 'demios.sqlite3')).Hash
          Start-Process -Wait -FilePath $setup -ArgumentList '/S'
          if (-not (Test-Path (Join-Path $data 'reinstall-check.txt')) -or (Get-FileHash (Join-Path $data 'demios.sqlite3')).Hash -ne $before) { throw 'NSIS reinstall changed local data' }
          $log += "nsis reinstall: local data kept ($data)"
          Launch $exe 'nsis-2'
          $uninstaller = Join-Path (Split-Path $exe) 'uninstall.exe'
          Start-Process -Wait -FilePath $uninstaller -ArgumentList '/S'
          Start-Sleep 3
          $kept = Test-Path (Join-Path $data 'reinstall-check.txt')
          $log += "nsis silent uninstall: app removed=$(-not (Test-Path $exe)), local data kept=$kept"

          $log | Tee-Object -FilePath out/smoke-windows.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-windows-x64
          path: out/
          retention-days: 1
          if-no-files-found: error

  linux:
    needs: meta
    # The oldest supported Ubuntu, so the AppImage runs on older glibc too.
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      DEMIOS_BUILD_COMMIT: ${{ needs.meta.outputs.short }}
      PREFIX: ${{ needs.meta.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/desktop/e2e/package-lock.json
            ui/artifact-sandbox/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-preview
      - name: Linux deps (webview, AppImage, WebDriver)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            libfuse2 file webkit2gtk-driver xvfb
      - *cargo-about-cache
      - *cargo-about-install
      - run: cargo fetch --locked
      - run: npm ci
        working-directory: apps/desktop
      - name: Vulkan SDK (pinned, checksum verified)
        run: |
          set -euo pipefail
          # The loader's window-system support (xcb, xlib, xrandr, wayland) needs their headers;
          # llama.cpp links against libvulkan, which the LunarG Linux SDK no longer ships.
          sudo apt-get install -y libx11-dev libxcb1-dev libxrandr-dev libwayland-dev libvulkan-dev
          f="vulkansdk-linux-x86_64-$VULKAN_SDK_VERSION.tar.xz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/linux/$f"
          echo "$VULKAN_SDK_SHA256_LINUX  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/vulkan"
          tar -xJf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/vulkan"
          sdk="$RUNNER_TEMP/vulkan/$VULKAN_SDK_VERSION/x86_64"
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/bin" >> "$GITHUB_PATH"
      - *vulkan-loader
      - name: tauri build (release)
        working-directory: apps/desktop
        run: npx tauri build --ci --features vulkan --config tauri.vulkan-linux.conf.json --bundles appimage,deb,rpm
      - name: Collect
        id: c
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$(ls target/release/bundle/appimage/*.AppImage | head -n1)" "out/$PREFIX-linux-x86_64.AppImage"
          cp "$(ls target/release/bundle/deb/*.deb | head -n1)" "out/$PREFIX-linux-amd64.deb"
          cp "$(ls target/release/bundle/rpm/*.rpm | head -n1)" "out/$PREFIX-linux-x86_64.rpm"
          chmod +x "out/$PREFIX-linux-x86_64.AppImage"
          for f in out/*; do echo "- $(basename "$f") (Vulkan build): $(du -k "$f" | cut -f1) KiB"; done >> "$GITHUB_STEP_SUMMARY"
          # The AppImage carries the pinned loader; deb and rpm depend on the system one.
          want=$(sed -n 's/.*sha256 \([0-9a-f]\{64\}\).*/\1/p' target/vulkan-loader/SOURCE.txt)
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/out/$PREFIX-linux-x86_64.AppImage" --appimage-extract usr/lib/libvulkan.so.1 > /dev/null)
          got=$(sha256sum "$RUNNER_TEMP/squashfs-root/usr/lib/libvulkan.so.1" | cut -d' ' -f1)
          [ "$got" = "$want" ] || { echo "::error::AppImage libvulkan.so.1 is $got, built $want"; exit 1; }
          dpkg-deb -f "out/$PREFIX-linux-amd64.deb" Depends | grep -q libvulkan1 || { echo "::error::deb does not depend on libvulkan1"; exit 1; }
          echo "bin=target/release/demios-desktop" >> "$GITHUB_OUTPUT"
      - *guard
      - name: Cache tauri-driver
        id: tauri-driver-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-${{ env.TAURI_DRIVER_VERSION }}-${{ runner.os }}-22.04
      - name: Install tauri-driver
        if: steps.tauri-driver-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version ${{ env.TAURI_DRIVER_VERSION }} --locked --force
      - run: npm ci
        working-directory: apps/desktop/e2e
      - name: Smoke test (.deb install, tauri-driver on the deb and the AppImage, reinstall keeps data, rpm on Fedora)
        working-directory: apps/desktop/e2e
        env:
          TAURI_WEBVIEW_AUTOMATION: "true"
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/out"
          deb="$out/$PREFIX-linux-amd64.deb"
          sudo apt-get install -y "$deb"
          echo "deb: installed $(dpkg-deb -f "$deb" Package Version | tr '\n' ' ') -> $(command -v demios-desktop)" | tee -a smoke.txt
          DEMIOS_E2E_APP=/usr/bin/demios-desktop xvfb-run -a npm run smoke
          echo "deb: tauri-driver smoke passed (main UI rendered)" | tee -a smoke.txt
          DEMIOS_E2E_APP="$out/$PREFIX-linux-x86_64.AppImage" xvfb-run -a npm run smoke
          echo "AppImage: tauri-driver smoke passed (main UI rendered)" | tee -a smoke.txt
          # Reinstall: run the installed app once on the real data dir, then reinstall the deb.
          data="${XDG_DATA_HOME:-$HOME/.local/share}/io.demios.app"
          rm -rf "$data"
          # Startup under xvfb takes ~30 s (AT-SPI bus timeout), so wait for the database.
          xvfb-run -a demios-desktop > app.log 2>&1 &
          run=$!
          for i in $(seq 1 45); do [ -f "$data/demios.sqlite3" ] && break; sleep 2; done
          sleep 3
          kill "$run" 2>/dev/null || true; pkill -f /usr/bin/demios-desktop || true; wait "$run" 2>/dev/null || true
          test -f "$data/demios.sqlite3" || { echo "::error::no database in $data"; cat app.log; ls -la "$data" || true; exit 1; }
          # No GPU on this runner: the Vulkan build must say it runs models on the processor.
          grep -F "local models: Local models run on the processor" app.log \
            || { echo "::error::the app did not report CPU mode"; cat app.log; exit 1; }
          echo "deb: no GPU here, app reports CPU mode ($(grep -F 'local models:' app.log | head -1))" | tee -a smoke.txt
          echo keep > "$data/reinstall-check.txt"
          before="$(sha256sum "$data/demios.sqlite3")"
          sudo apt-get install -y --reinstall "$deb"
          test -f "$data/reinstall-check.txt" && [ "$(sha256sum "$data/demios.sqlite3")" = "$before" ] \
            || { echo "::error::reinstall changed local data"; exit 1; }
          echo "deb reinstall: local data kept ($data)" | tee -a smoke.txt
          sudo apt-get remove -y "$(dpkg-deb -f "$deb" Package)" > /dev/null
          echo "deb remove: local data kept=$(test -f "$data/reinstall-check.txt" && echo true || echo false)" | tee -a smoke.txt
          # .rpm (Fedora, openSUSE): metadata and dependencies, then install it in a Fedora
          # container (dnf resolves its Requires) and check the app starts under Xvfb.
          rpmf="$out/$PREFIX-linux-x86_64.rpm"
          docker run --rm -v "$out:/out:ro" -e RPM="/out/$(basename "$rpmf")" fedora:latest bash -euo pipefail -c '
            rpm -qpi "$RPM" | sed -n "1,/^Description/p"
            echo "Requires:"; rpm -qpR "$RPM" | sed "s/^/  /"
            dnf -y -q install "$RPM" xorg-x11-server-Xvfb procps-ng > /dev/null
            echo "rpm: installed $(rpm -q "$(rpm -qp --qf "%{NAME}" "$RPM")") on $(. /etc/os-release; echo "$PRETTY_NAME")"
            Xvfb :99 > /dev/null 2>&1 & export DISPLAY=:99
            demios-desktop > /tmp/app.log 2>&1 & pid=$!
            db="$HOME/.local/share/io.demios.app/demios.sqlite3"
            for i in $(seq 1 45); do [ -f "$db" ] && break; kill -0 $pid || { cat /tmp/app.log; exit 1; }; sleep 2; done
            sleep 3
            kill -0 $pid || { echo "app exited"; cat /tmp/app.log; exit 1; }
            [ -f "$db" ] || { echo "no database after 90 s"; cat /tmp/app.log; exit 1; }
            grep -F "local models: Local models run on the processor" /tmp/app.log || { echo "no CPU-mode line"; cat /tmp/app.log; exit 1; }
            echo "rpm: app started under Xvfb (pid $pid alive, database created, CPU mode reported)"
          ' 2>&1 | tee rpm.txt
          grep -E "^rpm: " rpm.txt >> smoke.txt
          cp rpm.txt "$out/smoke-linux-rpm.txt"
          cp smoke.txt "$out/smoke-linux.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux-x64
          path: out/
          retention-days: 1
          if-no-files-found: error

  checksums:
    needs: [meta, macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS.txt and summary
        working-directory: dist
        run: |
          set -euo pipefail
          mkdir -p ../smoke
          mv smoke-* ../smoke/
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "## Demios Desktop ${{ needs.meta.outputs.version }} preview installers (unsigned)"
            echo
            echo "Commit \`$GITHUB_SHA\` (About shows \`${{ needs.meta.outputs.short }}\`). Artifact: **${{ needs.meta.outputs.prefix }}-${{ needs.meta.outputs.short }}**, kept 14 days."
            echo
            echo '| File | Size | SHA-256 |'
            echo '|---|---|---|'
            while read -r sum f; do echo "| $f | $(du -h "$f" | cut -f1) | \`${sum:0:16}…\` |"; done < SHA256SUMS.txt
            echo
            echo "### Smoke tests"
            echo '```'
            cat ../smoke/*.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.meta.outputs.prefix }}-${{ needs.meta.outputs.short }}
          path: |
            dist/
            smoke/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

  # A GitHub pre-release with the installers. Off unless started by hand from main with
  # `publish: true`.
  publish:
    needs: [meta, checksums]
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Only notes.md is needed; don't leave the write token in .git/config.
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.meta.outputs.prefix }}-${{ needs.meta.outputs.short }}
          path: release
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
          SHORT: ${{ needs.meta.outputs.short }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then echo "::error::release $TAG already exists"; exit 1; fi
          sed -e "s/{{VERSION}}/$VERSION/g" -e "s/{{COMMIT}}/$GITHUB_SHA/g" -e "s/{{SHORT}}/$SHORT/g" \
            .github/release-preview/notes.md > notes.md
          gh release create "$TAG" release/dist/* \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Demios Desktop $VERSION (Preview, unsigned)" \
            --notes-file notes.md
