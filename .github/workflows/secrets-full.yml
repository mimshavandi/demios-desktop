name: secrets-full
# Full-history secret scans (ADR-0009). Pull requests scan only their own commits (ci.yml);
# these runs make sure nothing escapes that: main's whole history on every push to main, and
# every branch on GitHub once a week, because anything pushed to this public repo is public.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets-full:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # only to open or update the alert issue below
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: fetch every branch
        if: github.event_name != 'push'
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: gitleaks (full history)
        env:
          LOG_OPTS: ${{ github.event_name == 'push' && 'HEAD' || '--all' }}
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose --config .gitleaks.toml --log-opts="$LOG_OPTS" .
      # This workflow can't block a merge, so a failure must not go unnoticed: open an issue, or
      # comment on the open one. It links to the run only. The findings are redacted in the log and
      # are never copied into the issue.
      - name: open or update the alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          title="Secret scan found something (secrets-full)"
          body="The full-history secret scan failed on \`$EVENT\`: $RUN_URL
          Read the run log (findings are redacted there). If a real secret was pushed, revoke it first: it is already public. If it's a false positive, list its exact fingerprint in \`.gitleaksignore\` with the reason, in a PR."
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
          echo "::error title=Secret scan failed::See the run log and the alert issue."
