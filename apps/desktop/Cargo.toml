[package]
name = "demios-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Demios Desktop: Tauri 2 shell (ADR-0002)."
publish = false
default-run = "demios-desktop"

[lib]
name = "demios_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "demios-desktop"
path = "src/main.rs"

[features]
default = ["dev-fake-model"]
# T-SHELL-03: registers `FakeChatModel` as `local:dev-fake` so the app answers before a
# real backend merges. Drop from `default` once dn-inference / dn-providers are wired in.
dev-fake-model = []
# Set by `tauri build`: embed the built UI instead of using the dev server.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
dn-core.workspace = true
dn-store.workspace = true
futures-core.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tauri.workspace = true
tokio = { workspace = true, features = ["sync", "macros", "time", "rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
