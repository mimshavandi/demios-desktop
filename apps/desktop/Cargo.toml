[package]
name = "demios-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Demios Desktop: Tauri 2 shell (ADR-0002)."
publish = false
default-run = "demios-desktop"

[lib]
name = "demios_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "demios-desktop"
path = "src/main.rs"

[features]
default = []
# T-SHELL-03: registers `FakeChatModel` as `local:dev-fake` so the app answers before a
# real backend merges. Debug builds only: build.rs sets `cfg(fake_model)` when this feature
# is on *and* debug assertions are enabled, so a release build never contains it.
# `npm run dev:app` turns it on.
dev-fake-model = []
# Flatpak builds (packaging/flatpak): only remote (HTTP) MCP servers, since the sandbox
# can't run programs on the host. Also detected at run time from `FLATPAK_ID`.
flatpak = []
# Connect (ADR-0018): trust the throwaway TEST key (connect/test-key.pub) for the catalogue's
# signature. Debug builds only: build.rs sets `cfg(connect_test_key)` when this feature is on
# *and* debug assertions are enabled. Without it no key is trusted yet and the Connect list
# says the catalogue couldn't be checked (the release key is the owner's decision).
connect-test-key = []
# Set by `tauri build`: embed the built UI instead of using the dev server.
custom-protocol = ["tauri/custom-protocol"]
# T-STORE-08: the signed self-updater. Only direct-download builds (macOS DMG, Windows
# MSI/NSIS, AppImage) turn it on; MSIX and Flatpak builds must not (stores update the app).
updater = ["dep:tauri-plugin-updater"]
# T-INF-24: local models on the GPU through Vulkan (NVIDIA, AMD, Intel) on Windows and Linux.
# Release installers turn it on (with tauri.vulkan-*.conf.json, which ship the Khronos loader
# or depend on the system one); without a usable GPU the app runs models on the processor and
# says so. macOS always uses Metal.
vulkan = ["dn-inference/vulkan"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
dn-core.workspace = true
dn-store.workspace = true
dn-secrets.workspace = true
dn-agent.workspace = true
dn-providers = { path = "../../crates/dn-providers", version = "0.1.0" }
dn-tools = { path = "../../crates/dn-tools", version = "0.1.0" }
dn-artifacts = { path = "../../crates/dn-artifacts", version = "0.1.0" }
dn-inference = { path = "../../crates/dn-inference", version = "0.1.0" }
dn-knowledge = { path = "../../crates/dn-knowledge", version = "0.1.0" }
dn-models = { path = "../../crates/dn-models", version = "0.1.0" }
# Add-ons (ADR-0013): the interface they build against, and the background-job scheduler.
dn-plugin-api.workspace = true
dn-jobs = { path = "../../crates/dn-jobs", version = "0.1.0" }
futures-core.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `unstable`: multiwebview (Window::add_child) for the Windows artifact webview (ADR-0012).
tauri = { workspace = true, features = ["unstable"] }
# Opens the "Report a problem" form in the system browser, from Rust only (T-STORE-14).
tauri-plugin-opener = "2"
# Native confirm before launching a local MCP server, shown from Rust only (T-SHELL-08).
tauri-plugin-dialog = "2"
# Parse the OAuth sign-in URL before opening it (T-SHELL-08); already in the tree via reqwest.
url = "2"
# Fingerprints of MCP tools, to flag ones that change after review (T-SHELL-11).
sha2.workspace = true
# demios://models/add links (T-INF-12): the OS hands the URL to the running app; Rust only.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Signed self-update for direct downloads only (T-STORE-08). Off unless the `updater` feature
# is on: Microsoft Store (MSIX) and Flathub builds leave it out and never self-update.
# No `zip` feature: it only unpacks the old v1 update archives (.zip, .AppImage.tar.gz), and
# its `zip` 4 has open advisories. We publish v2 bundles (`createUpdaterArtifacts: true`).
tauri-plugin-updater = { version = "2", optional = true, default-features = false, features = ["rustls-tls", "system-proxy"] }
tokio = { workspace = true, features = ["sync", "macros", "time", "rt"] }
# Ed25519 check of the Connect catalogue's signature (ADR-0018); already built in as rustls's
# crypto provider (same version), as for dn-sync.
aws-lc-rs.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util"] }

[lints]
workspace = true
