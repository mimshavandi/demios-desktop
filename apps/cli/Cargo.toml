[package]
name = "dn"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
cuda = ["dn-inference/cuda"]
vulkan = ["dn-inference/vulkan"]

[dependencies]
dn-core.workspace = true
dn-inference = { workspace = true, features = ["llamacpp"] }
dn-models.workspace = true
dn-secrets.workspace = true
dn-store.workspace = true
dn-sync.workspace = true
# The Node's licence check (ADR-0014 §9a, #377).
dn-licence.workspace = true
dn-jobs.workspace = true
dn-plugin-api.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "signal"] }
sysinfo.workspace = true

[dev-dependencies]
# Tests sign licence files with a key made for the run (never stored).
aws-lc-rs.workspace = true

[lints]
workspace = true
